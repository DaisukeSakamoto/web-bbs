<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Web BBS 管理</title><link rel="stylesheet" href="/style.css"><script type="module" src="/admin.js"></script></head><body><header><h1>管理者ダッシュボード</h1><a href="/">掲示板へ</a></header><main><p id="status" role="status"></p><section id="login"><h2>管理者ログイン</h2><form id="login-form"><label>パスワード<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label><button>ログイン</button></form></section><div id="panel" hidden><section><button id="logout">ログアウト</button><button id="refresh">更新</button><h2 id="counts"></h2><button id="pause"></button></section><section><h2>通報一覧（最大100件）</h2><div id="reports"></div></section><section><h2>最新投稿（最大100件）</h2><form id="delete-form"><label>投稿ID<input name="id" type="number" min="1" required></label><button>指定IDの投稿を削除</button></form><div id="posts"></div></section><section><h2>操作履歴</h2><div id="audit"></div></section></div></main></body></html>
