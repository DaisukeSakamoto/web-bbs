<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Web BBS</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head><body><header><h1>Web BBS</h1><p>匿名で知識と意見を共有する掲示板</p></header><main><p id="status" role="status"></p><section><h2>新規スレッド</h2><form id="new"><label>カテゴリ <select name="category"><option value="general">雑談</option><option value="technology">技術</option><option value="ai">AI</option><option value="iot">IoT</option></select></label><input name="title" aria-label="タイトル" placeholder="タイトル" required maxlength="120"><textarea name="body" aria-label="本文" placeholder="本文" required maxlength="4000"></textarea><button>投稿する</button></form></section><section><h2>スレッド一覧</h2><form id="search"><label>カテゴリ <select name="category"><option value="">すべて</option><option value="general">雑談</option><option value="technology">技術</option><option value="ai">AI</option><option value="iot">IoT</option></select></label><input name="q" aria-label="検索" placeholder="キーワード"><button>検索</button></form><div id="threads"></div><nav aria-label="ページ"><button id="prev">前へ</button> <span id="page-info"></span> <button id="next">次へ</button></nav></section><section id="detail" hidden><button id="back">一覧へ戻る</button><div id="selected"></div><h3>返信</h3><form id="reply"><textarea name="body" aria-label="返信本文" required maxlength="4000"></textarea><button>返信する</button></form></section></main></body></html>
